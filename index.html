<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TX-08 DINO.MOD — Modular 8-Bit Print Artifact</title>
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body data-theme="light">
  <!-- Full-Viewport Minimalist Cyclorama Stage -->
  <div id="viewportContainer">
    <canvas id="webglCanvas"></canvas>
    <!-- 2D Projected Interactive Anchor Socket Pins -->
    <div id="anchorOverlay" aria-label="3D Anchor Sockets"></div>
    <!-- Drag-and-Drop Floating Ghost Chip -->
    <div id="dragGhost" class="drag-ghost hidden"></div>
  </div>

  <!-- Loading Pill -->
  <div id="loadingPill" class="floating-pill loading-pill">
    <span class="pulse-dot"></span>
    <span id="loadingText">INITIALIZING TX-08 MODULAR KIT…</span>
  </div>

  <!-- PILL 1: Top-Left Brand & Studio Controls Pill -->
  <header class="top-bar">
    <div class="floating-pill brand-pill" id="topLeftPill">
      <div class="brand-badge" title="TX-08 Modular 8-Bit Chrome Dino × Mr. Potato Head Print Artifact">
        <svg class="dino-glyph" viewBox="0 0 24 24" width="17" height="17" fill="currentColor">
          <path d="M13 2h7v2h2v5h-2v2h-4v2h3v2h-3v3h-2v2h2v2h-4v-3h-2v3H6v-2h2v-2H6v-2H4v-3H2V9h2v2h2v2h3V9h2V6h2V2zm3 2v2h2V4h-2z"/>
        </svg>
        <span class="brand-name">TX-08 <span class="brand-sub">DINO.MOD</span></span>
      </div>

      <div class="pill-divider"></div>

      <button id="btnToggleAnchors" class="icon-pill-btn active" title="Show/Hide 3D Socket Ports on Chassis">
        <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="10" cy="10" r="3.2"/>
          <circle cx="10" cy="10" r="7.2" stroke-dasharray="2.5 2.5"/>
        </svg>
        <span>PORTS</span>
      </button>

      <button id="btnTogglePegs" class="icon-pill-btn" title="Explode View: Inspect Coaxial Notched Snap Pegs & Socket Holes">
        <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 10h6M4 7v6M16 7v6"/>
          <circle cx="4" cy="10" r="2"/>
          <circle cx="16" cy="10" r="2"/>
        </svg>
        <span>PEGS</span>
      </button>

      <button id="btnRandomize" class="icon-pill-btn" title="Shuffle Modular Loadout">
        <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 3h3v3M3 14l4-4M17 3l-6 6M14 17h3v-3M3 6l14 11"/>
        </svg>
        <span>RND</span>
      </button>

      <button id="btnReset" class="icon-pill-btn" title="Detach All Modules to Bare Chassis">
        <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h12M7 6V4h6v2M6 6v10a1 1 0 001 1h6a1 1 0 001-1V6"/>
        </svg>
        <span>CLR</span>
      </button>

      <button id="btnTheme" class="icon-pill-btn icon-only" title="Toggle Studio Cyclorama Lighting">
        <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="10" cy="10" r="4.5"/>
          <path d="M10 2v2M10 16v2M2 10h2M16 10h2"/>
        </svg>
      </button>
    </div>

    <!-- PILL 2: Top-Right 3D Print Telemetry & Export Pill -->
    <div class="export-zone">
      <div class="floating-pill export-pill" id="topRightPill">
        <div class="print-telemetry" title="100% Watertight Manifold Geometry Ready for Home 3D Printing">
          <span class="status-dot manifold"></span>
          <span id="telemetrySummary">100MM • 38G PLA</span>
        </div>
        <button id="btnOpenExport" class="primary-pill-cta">
          <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M10 3v9m0 0l-3.5-3.5M10 12l3.5-3.5M4 15v2h12v-2"/>
          </svg>
          <span>EXPORT STL</span>
        </button>
      </div>

      <!-- Compact Floating 3D Print Popover Card -->
      <div id="exportModal" class="export-popover hidden" role="dialog" aria-label="Export 3D Print Settings">
        <div class="popover-header">
          <div>
            <div class="popover-title">FABRICATION SPECS</div>
            <div class="popover-subtitle">Watertight Z-up millimeter geometry</div>
          </div>
          <span class="manifold-badge">MANIFOLD ✓</span>
        </div>

        <div class="popover-section">
          <label class="popover-label">Output Format</label>
          <div class="segmented-pill" id="printModeGroup">
            <button class="seg-btn active" data-mode="merged" title="Single fused solid figurine">Merged Solid</button>
            <button class="seg-btn" data-mode="modular" title="Separate parts on print plate with notched pegs & sockets">Peg &amp; Socket Kit</button>
            <button class="seg-btn" data-mode="glb" title="Full color 3D GLB scene">Color GLB</button>
          </div>
        </div>

        <div class="popover-section">
          <label class="popover-label">Artifact Scale (Height)</label>
          <div class="segmented-pill" id="printScaleGroup">
            <button class="seg-btn" data-scale="80">80mm</button>
            <button class="seg-btn active" data-scale="100">100mm</button>
            <button class="seg-btn" data-scale="120">120mm</button>
            <button class="seg-btn" data-scale="150">150mm</button>
          </div>
        </div>

        <div class="popover-section">
          <button id="btnTogglePlatePreview" class="plate-toggle-pill">
            <span>Slicer Build Plate (200×200mm)</span>
            <span class="toggle-indicator" id="plateToggleIndicator">OFF</span>
          </button>
        </div>

        <div class="specs-grid">
          <div class="spec-item">
            <span class="spec-k">Envelope</span>
            <span class="spec-v" id="specDims">56 × 83 × 100 mm</span>
          </div>
          <div class="spec-item">
            <span class="spec-k">Modules</span>
            <span class="spec-v" id="specParts">1 chassis + 0 parts</span>
          </div>
          <div class="spec-item">
            <span class="spec-k">Mesh Tris</span>
            <span class="spec-v" id="specTris">58,644</span>
          </div>
          <div class="spec-item">
            <span class="spec-k">Est. Mass</span>
            <span class="spec-v" id="specWeight">~38g PLA (20% infill)</span>
          </div>
        </div>

        <button id="btnDownloadPrint" class="download-action-pill">
          <span id="downloadBtnText">DOWNLOAD MERGED .STL</span>
        </button>
      </div>
    </div>
  </header>

  <!-- PILL 3: Bottom-Center Floating Configurator Pill Stack -->
  <footer class="bottom-dock" id="bottomDock">
    <!-- Sub-Pill: 11 Industry Editions & Active Filament Swatches -->
    <div class="floating-pill context-pill" id="contextPill">
      <div class="preset-chips" id="presetChips">
        <span class="context-tag">EDITION</span>
        <button class="mini-chip active" data-preset="tech">💻 Tech</button>
        <button class="mini-chip" data-preset="healthcare">🩺 Healthcare</button>
        <button class="mini-chip" data-preset="legal">⚖️ Legal</button>
        <button class="mini-chip" data-preset="finance">📈 Finance</button>
        <button class="mini-chip" data-preset="creative">🎨 Creative</button>
        <button class="mini-chip" data-preset="retail">🛍️ Retail</button>
        <button class="mini-chip" data-preset="research">🧪 Research</button>
        <button class="mini-chip" data-preset="hospitality">☕ Hospitality</button>
        <button class="mini-chip" data-preset="travel">✈️ Travel</button>
        <button class="mini-chip" data-preset="manufacturing">⚙️ Mfg</button>
        <button class="mini-chip" data-preset="industrial">🔧 Industrial</button>
      </div>
      <div class="pill-divider"></div>
      <div class="swatch-row" id="swatchRow" title="Customize Active Module Filament Color"></div>
    </div>

    <!-- Main Pill: Socket Port Tabs + Snap-On Module Carousel -->
    <div class="floating-pill dock-pill" id="mainDockPill">
      <nav class="slot-tabs" id="slotTabs" aria-label="Socket Port Categories"></nav>
      <div class="accessory-strip" id="accessoryStrip" aria-label="Snap-On Modules"></div>
    </div>
  </footer>

  <!-- Subtle Toast Pill for Snap / Export Feedback -->
  <div id="toastPill" class="floating-pill toast-pill hidden"></div>

  <script type="module" src="/app.js?v=5"></script>
</body>
</html>
